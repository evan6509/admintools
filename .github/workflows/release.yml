name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main builds so consecutive merges each receive a unique release.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release numbering
        run: python3 tests/test_release_version.py
      - name: Select release version
        id: release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          version=$(python3 .github/scripts/release_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all modules and run logic tests
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          args=()
          if [[ -n "$RELEASE_VERSION" ]]; then
            args+=("-PreleaseVersion=$RELEASE_VERSION")
          fi
          ./gradlew build runUnitTests "${args[@]}"
      - name: Verify production Fabric JARs
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version || '1.0.0' }}
        run: python3 tests/test_fabric_targets.py --jars
      - name: Collect installable JARs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-jars
          modules=(version-*/build.gradle paper-*/build.gradle)
          if ((${#modules[@]} == 0)); then
            echo 'No version modules found' >&2
            exit 1
          fi
          for build_file in "${modules[@]}"; do
            module=${build_file%/build.gradle}
            jars=()
            for jar in "$module"/build/libs/*.jar; do
              case "$jar" in
                *-sources.jar|*-javadoc.jar|*-dev.jar) ;;
                *) jars+=("$jar") ;;
              esac
            done
            if ((${#jars[@]} != 1)); then
              echo "Expected one installable JAR for $module, found ${#jars[@]}" >&2
              exit 1
            fi
            destination="release-jars/${jars[0]##*/}"
            if [[ -e "$destination" ]]; then
              echo "Duplicate JAR name: $destination" >&2
              exit 1
            fi
            cp "${jars[0]}" "$destination"
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admintools-${{ github.run_id }}
          path: release-jars/*.jar
          if-no-files-found: error
      - name: Attach JARs to GitHub release
        if: steps.release.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Choose the JAR matching your server platform and Minecraft version.
            Clients do not need AdminTools. See README.md for installation and
            the Fabric and Paper feature comparison.
          files: release-jars/*.jar
          fail_on_unmatched_files: true
