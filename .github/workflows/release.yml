name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all modules and run logic tests
        run: ./gradlew build runUnitTests
      - name: Collect installable JARs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-jars
          modules=(version-*/build.gradle paper-*/build.gradle)
          if ((${#modules[@]} == 0)); then
            echo 'No version modules found' >&2
            exit 1
          fi
          for build_file in "${modules[@]}"; do
            module=${build_file%/build.gradle}
            jars=()
            for jar in "$module"/build/libs/*.jar; do
              case "$jar" in
                *-sources.jar|*-javadoc.jar|*-dev.jar) ;;
                *) jars+=("$jar") ;;
              esac
            done
            if ((${#jars[@]} != 1)); then
              echo "Expected one installable JAR for $module, found ${#jars[@]}" >&2
              exit 1
            fi
            destination="release-jars/${jars[0]##*/}"
            if [[ -e "$destination" ]]; then
              echo "Duplicate JAR name: $destination" >&2
              exit 1
            fi
            cp "${jars[0]}" "$destination"
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admintools-${{ github.run_id }}
          path: release-jars/*.jar
          if-no-files-found: error
      - name: Attach JARs to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Choose the JAR matching your server platform and Minecraft version.
            Clients do not need AdminTools. See README.md for installation and
            the Fabric and Paper feature comparison.
          files: release-jars/*.jar
          fail_on_unmatched_files: true
