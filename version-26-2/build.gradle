plugins {
    id("net.fabricmc.fabric-loom") version "${loom_version_26_2}"
}

base {
    archivesName = "admintools-26.2"
}

loom {
    mods {
        admintools {
            sourceSet sourceSets.main
        }
    }
    runs {
        gametest {
            // Runs the @GameTest methods in com.echubbuck.admintools.test.
        }
    }
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version_26_2}")
    implementation("net.fabricmc:fabric-loader:${loader_version_26_2}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version_26_2}")
    implementation("com.google.code.gson:gson:2.10.1")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

test {
    failOnNoDiscoveredTests = false
}

tasks.register("runUnitTests", JavaExec) {
    group = "verification"
    description = "Runs the dependency-free unit tests (ItemLogicTestRunner)."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.echubbuck.admintools.common.ItemLogicTestRunner"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
